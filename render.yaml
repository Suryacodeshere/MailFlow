services:
  - type: web
    name: MailFlow-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: MailFlow-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: ELASTICSEARCH_NODE
        sync: false
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 200
      - key: SMTP_HOST
        value: "smtp.ethereal.email"
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: "https://frontend-5szpgnirh-suryas-projects-b65a9565.vercel.app"
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false

databases:
  - name: MailFlow-postgres
    plan: free
    databaseName: scheduler_db
    user: root
